<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>AltGrade — Online Banking for All | Hyper-Personalized Banking for Bharat</title>
    <meta name="title" content="AltGrade — Online Banking for All" />
    <meta
      name="description"
      content="AI-Powered Hyper-Personalized Banking for Bharat: Tailored lending, vernacular conversational journeys, and empathetic financial stress detection."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AltGrade — Online Banking for All" />
    <meta
      property="og:description"
      content="AI-Powered Hyper-Personalized Banking for Bharat: Tailored lending, vernacular conversational journeys, and empathetic financial stress detection."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="AltGrade — Online Banking for All" />
    <meta
      property="twitter:description"
      content="AI-Powered Hyper-Personalized Banking for Bharat: Tailored lending, vernacular conversational journeys, and empathetic financial stress detection."
    />

    <!-- Geist font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- Synchronous Intro Phase Check before paint -->
    <script>
      (function() {
        try {
          var s = window.location.search;
          var h = window.location.hash;
          var f = s.match(/[?&]intro=([^&]+)/);
          var fv = f ? f[1] : null;
          var ha = (h && h !== '#') || Boolean(sessionStorage.getItem('recursive:skip-intro-for-anchor'));
          var r = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var completed = sessionStorage.getItem('recursive:intro:v1') === '1';

          if (fv !== '0' && !ha && (!r || fv === '1') && !completed) {
            document.documentElement.dataset.intro = 'playing';
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, 0);
          } else {
            document.documentElement.dataset.intro = 'done';
          }
        } catch (e) {
          document.documentElement.dataset.intro = 'done';
        }
      })();
    </script>

    <!-- Devfolio SDK -->
    <script defer src="https://apply.devfolio.co/v2/sdk.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
